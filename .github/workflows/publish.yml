name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish (for example, v1.0.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          expected_tag="v$(node --print "require('./package.json').version")"
          if [[ "$TAG" != "$expected_tag" ]]; then
            echo "Expected tag $expected_tag, received $TAG" >&2
            exit 1
          fi
          git rev-parse --verify "refs/tags/$TAG^{commit}"

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.23.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Set up npm trusted publishing
        run: npm install --global npm@11.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Run checks
        run: pnpm check

      - name: Build package
        run: pnpm build

      - name: Smoke test package entry point
        run: node --input-type=module --eval "await import('./dist/index.js')"

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Publish package
        run: npm publish --access public --provenance
